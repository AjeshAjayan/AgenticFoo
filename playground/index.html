<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>agent-foo playground</title>
    <script>
        // Apply a saved theme before first paint so the page doesn't flash the other one.
        try {
            const t = localStorage.getItem("agent-foo-theme");
            if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap" />
</head>

<body>
    <div id="app"></div>
    <script type="module" src="./index.tsx"></script>
</body>

</html>
